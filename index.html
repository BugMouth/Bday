<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">

    <title>Birthday</title>

    <link rel="stylesheet" href="style.css"> 
</head>
<body>


    <!-- Tela do envelope -->
     
    <div id="envelope-container">
        <img src="envelope.png" alt="Envelope" id="envelope">
        <p>Carta para você</p>

    </div>



    <!-- Tela da carta -->

    <div id="carta-container">
        <div class="janela-carta">
            <h1 id="titulo-carta">Está chegando aos 100 anos hoje??</h1>

                <img src="gato_coracao.gif" class="gato" id="carta-gato">

            <div class="botoes" id="botoes-carta">
                <img src="sim.png" class="botao botao-sim" alt="Sim">

                <div class="no-wrapper">
                    <img src="nao.png" class="botao botao-nao" alt="Nao">

                </div>
                    
            </div>

            <p id="texto-carta" class="texto-carta" style="display: none;">
                <strong>Data do Aniversário:</strong> 19 / 05 <br>
                Feliz Aniversário Mama!! Muitas felicidades no auge dos seus 100 anos de vida
            </p>

        </div>
        
    </div>
        

    <script src = "script.js"></script>
    
</body>
</html>
